  Erstellt mit: KI-Assistent (Antigravity AI / Pair-Programming Agent)
  Erstellt für / Autor: Joshua Mößmer (J-Moessmer)

-->
<header class="top-nav-bar">
  <a class="brand-link" routerLink="/solar-system" aria-label="Zur Startseite Sonnensystem">
    <i class="fa-solid fa-sun brand-icon" aria-hidden="true"></i>
    <div class="brand-titles">
      <span class="brand-main">SSI App</span>
      <span class="brand-sub">Solar System Info APP</span>
    </div>
  </a>

  <nav class="main-nav" aria-label="Hauptnavigation">
    <ul class="nav-list">
      @for (item of navItems; track item.route) {
        <li class="nav-item">
          <a
            class="nav-link"
            [routerLink]="item.route"
            routerLinkActive="active-link"
            #rla="routerLinkActive"
            [attr.aria-current]="rla.isActive ? 'page' : null"
          >
            <i [class]="item.faIcon" aria-hidden="true"></i>
            <span class="nav-label">{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>

    <button
      type="button"
      class="theme-toggle-btn"
      (click)="theme.toggleTheme()"
      [attr.aria-label]="theme.isDarkMode() ? 'Zum hellen Tagmodus wechseln' : 'Zum dunklen Nachtmodus wechseln'"
    >
      <i
        class="fa-solid"
        [class.fa-sun]="theme.isDarkMode()"
        [class.fa-moon]="!theme.isDarkMode()"
        aria-hidden="true"
      ></i>
      <span class="theme-label">{{ theme.isDarkMode() ? 'Tagmodus' : 'Nachtmodus' }}</span>
    </button>
  </nav>
</header>
