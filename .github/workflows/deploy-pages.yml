# Projekt / Modul: SSI App – Solar System Info App / GitHub Pages CI/CD Workflow (deploy-pages.yml)
# FCPP-Referenz: P10-U10 (Automatisches GitHub Pages Deployment mit relativem Base-Href)
# Erstellt mit: KI-Assistent (Antigravity AI / Pair-Programming Agent)
# Erstellt für / Autor: Joshua Mößmer (J-Moessmer)
# Datum / Version: 17.11.2026 / v1.0

name: Deploy Angular SSI App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (Vitest)
        run: npx ng test --watch=false

      - name: Build Angular 22 app for GitHub Pages
        run: npx ng build --base-href ./

      - name: Create .nojekyll file in dist/ssi-app/browser
        run: touch dist/ssi-app/browser/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/ssi-app/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
